<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b23">
<title>FEED DAYS | Account</title>
<link rel="stylesheet" href="styles/game.css">
<link rel="stylesheet" href="styles/account.css">
<script src="scripts/account.js" defer></script>
</head>
<body class="account-page">
<main class="account-panel">
<p class="account-eyebrow">FEED DAYS · PHASE 2</p>
<h1>FEED DAYS</h1>
<p>ยินดีต้อนรับสู่เมืองวงแหวน</p>
<div class="account-tabs" aria-label="เมนูบัญชี">
<button class="pick" type="button" id="login-tab" aria-pressed="true">เข้าสู่ระบบ</button>
<button class="pick" type="button" id="register-tab" aria-pressed="false">สมัครสมาชิก</button>
</div>
<form id="account-form">
<h2 id="form-title">เข้าสู่ระบบ</h2>
<label for="account-id">Login ID</label>
<input id="account-id" name="id" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ตัวอักษรอังกฤษ ตัวเลข หรือ _">
<label for="password">Password</label>
<input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
<div id="confirm-row" hidden><label for="confirm-password">ยืนยัน Password</label><input id="confirm-password" type="password" maxlength="128" autocomplete="new-password" disabled></div>
<p id="password-hint" hidden>รหัสผ่านอย่างน้อย 10 ตัวอักษร</p>
<button class="pick account-submit" id="submit-account" type="submit">เข้าสู่ระบบ</button>
</form>
<p id="account-status" role="status" aria-live="polite">กำลังตรวจสอบการเชื่อมต่อ...</p>
<noscript>กรุณาเปิด JavaScript เพื่อเล่นเกม</noscript>
<p class="account-foot">บัญชีออนไลน์ · เกมต้นแบบสำหรับผู้เล่นคนเดียว</p>
</main>
</body>
</html>
